# Traefik -> pve:8006 over TLS, verified.
#
# pve serves a certificate from its own cluster CA, for the names pve,
# pve.homelab and localhost (not proxmox.internal -- browsers never see that
# certificate, Traefik does). Verifying against pve's root and the name `pve`
# keeps the hop to pve authenticated instead of skipping verification.
#
# pve renews its node certificate itself, signed by the same root, so this
# keeps working until the root expires in September 2036.
#
# The certificate below is public: it is /etc/pve/pve-root-ca.pem on pve.
