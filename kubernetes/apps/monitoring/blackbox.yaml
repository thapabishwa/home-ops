# Atlassian's shared login, which every site signs in through.
# /login, not /: the root answers 301 to it.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: atlassian
spec:
  jobName: blackbox-work
  interval: 60s
  scrapeTimeout: 15s
  module: http_2xx
  prober:
    url: blackbox.monitoring.svc:9115
  targets:
    staticConfig:
      labels: {service: atlassian}
      static:
          - https://id.atlassian.com/login
      relabelingConfigs:
        - action: labeldrop
          regex: namespace
---
