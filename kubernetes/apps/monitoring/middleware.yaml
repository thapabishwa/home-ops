# HTTP -> HTTPS for prometheus.internal. Does nothing to a request already on HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Everything on the LAN except the guest pool, 10.0.0.160/27. The operator
# always enables Prometheus's lifecycle API -- its config reloader needs it --
# so anyone who can reach the UI can also POST /-/quit and stop the alerting.
# Traefik sees the real client address: its Service is externalTrafficPolicy
# Local.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: not-guests
spec:
  ipAllowList:
    sourceRange:
      - 10.0.0.0/25
      - 10.0.0.128/27
      - 10.0.0.192/26
