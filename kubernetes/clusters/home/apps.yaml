# Everything under kubernetes/apps, reconciled from this repo.
#
# `flux bootstrap` writes flux-system/ next to this file and points the root
# Kustomization at this directory, so anything here is applied -- this file is
# the one hop from the cluster's entry point to the apps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  path: ./kubernetes/apps
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
