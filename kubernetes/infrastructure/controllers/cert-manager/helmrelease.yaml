# TLS certificates for every .internal name, issued by our own CA.
#
# A public CA cannot help here: Let's Encrypt and friends do not issue for
# .internal, which is reserved for private use. So the cluster runs a private
# CA (../../configs/internal-ca.yaml) and cert-manager issues from it for any
# Ingress annotated with `cert-manager.io/cluster-issuer: internal-ca`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
      # Deleting the CRDs deletes every Certificate and Issuer with them --
      # including the root CA's. Keep them even if the release goes.
      keep: true
