# The metrics.k8s.io API: `kubectl top`, Lens's graphs, and the CPU/memory
# figures Homepage shows for pods in its Cluster group.
#
# Runs with full kubelet TLS verification. That works because Talos has
# serverTLSBootstrap on and kubelet-serving-cert-approver signs the kubelets'
# certificates -- no --kubelet-insecure-tls.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  interval: 30m
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
