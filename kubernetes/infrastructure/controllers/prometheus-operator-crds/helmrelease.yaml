# The Prometheus Operator's CRDs -- ServiceMonitor, Probe, PrometheusRule and
# the rest -- on their own, ahead of the apps.
#
# They are installed here rather than by kube-prometheus-stack because the
# monitoring app ships objects of these kinds next to its HelmRelease, and a
# custom resource cannot be applied until its CRD exists. This chart keeps
# them in templates/, so Helm upgrades them too.
#
# Keep the operator version in step with kube-prometheus-stack
# (apps/monitoring/ocirepository.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: prometheus-operator-crds
